# The nightly retirement sweep (#97). It asks the platform to flag every
# deprecated project whose services served no traffic for
# retirement_idle_days (policy/platform/data.yaml): each idle project gets one
# "Retire <project>?" issue in its first repo. It never retires anything; a
# person runs `rlp lifecycle retire`. See docs/lifecycle.md#retirement-sweep.
#
# It needs the RLP_PLATFORM_URL variable (and RLP_PLATFORM_HOST when the
# platform is reached by Host header) and the RLP_PLATFORM_TOKEN secret;
# without the URL it does nothing. The sweep is a loop: the RLP_LOOPS Actions
# variable set to off skips the job, and RLP_LOOPS=off in the platform's own
# environment makes the platform answer "disabled".
name: retirement-sweep

on:
  schedule:
    - cron: "23 3 * * *"  # nightly, 03:23 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report each deprecated project's result and change nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: retirement-sweep
  cancel-in-progress: false

jobs:
  sweep:
    # The kill switch: any off value of RLP_LOOPS skips the whole job.
    if: ${{ !contains(fromJSON('["off", "0", "false", "no", "disabled"]'), vars.RLP_LOOPS || 'on') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RLP_LOOPS: ${{ vars.RLP_LOOPS }}
      RLP_PLATFORM_URL: ${{ vars.RLP_PLATFORM_URL }}
      RLP_PLATFORM_HOST: ${{ vars.RLP_PLATFORM_HOST }}
      RLP_PLATFORM_TOKEN: ${{ secrets.RLP_PLATFORM_TOKEN }}
      DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install rlp from this checkout
        run: |
          python -m pip install --disable-pip-version-check .
          rlp --version
      - name: Sweep
        run: |
          if [ -z "$RLP_PLATFORM_URL" ]; then
            echo "::notice::The RLP_PLATFORM_URL variable is not set, so there is no platform to sweep."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            rlp lifecycle sweep --dry-run
          else
            rlp lifecycle sweep
          fi
