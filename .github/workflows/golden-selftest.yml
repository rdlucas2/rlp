# Runs the golden pipeline from this checkout on the hello fixture repo, so a
# change to golden.yml or the CLI is proven end to end before it merges.
# Publishing is off: the fixture is not a real project.
name: golden-selftest

on:
  pull_request:
    # labeled and unlabeled: the agent:authored label decides whether the
    # rlp.agent rules apply, and a PR is often labelled after it opens.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]  # golden.yml's gate-review re-checks on each review
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write  # golden.yml uploads SARIF to code scanning
  pull-requests: read  # golden.yml's gate-review job reads the PR's reviews

concurrency:
  group: golden-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hello:
    uses: ./.github/workflows/golden.yml
    with:
      rlp-version: "path:."
      working-directory: tests/pipeline/fixtures/hello
      publish: false
