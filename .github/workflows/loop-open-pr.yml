# Opens the pull request for a build-loop branch as the rlp GitHub App (#99).
# One reusable workflow every repo the loop works in calls on push to its loop
# branches:
#
#   on:
#     push:
#       branches: ["agent/**"]
#   permissions: {}
#   jobs:
#     open-pr:
#       uses: rdlucas2/rlp/.github/workflows/loop-open-pr.yml@<rlp git ref>
#       secrets:
#         app-id: ${{ secrets.APP_ID }}
#         app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
#
# The build loop pushes as Ryan's account, and gate-review never counts the PR
# author's approval. A PR the App opens has localrlp[bot] as its author, so
# Ryan can approve it. The PR targets the default branch, is titled from the
# tip commit and labelled agent:authored; the loop then writes its title and
# body. A branch that already has a PR, open or closed, gets no second one.
# See docs/loops.md#agent-identity.
name: loop-open-pr

on:
  workflow_call:
    secrets:
      app-id:
        description: The rlp GitHub App's id (APP_ID)
        required: true
      app-private-key:
        description: The rlp GitHub App's private key (APP_PRIVATE_KEY)
        required: true

# No workflow-level permissions: the PR is opened with the App's token, not
# GITHUB_TOKEN.

jobs:
  open:
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: loop-open-pr-${{ github.ref }}
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-pull-requests: write  # open the PR
          permission-issues: write         # label it
      - name: Open the PR as the App
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
          MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${owner}:${BRANCH}" \
            --jq '[.[] | "#\(.number) (\(.state))"] | join(", ")')"
          if [ -n "$existing" ]; then
            echo "${BRANCH} already has a pull request: ${existing}"
            exit 0
          fi
          title="${MESSAGE%%$'\n'*}"
          body="Opened for the rlp build loop by the rlp GitHub App from ${BRANCH} at ${SHA}. The loop writes the description next."
          number="$(gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="${title:-$BRANCH}" -f head="$BRANCH" -f base="$BASE" -f body="$body" --jq .number)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/labels" -f "labels[]=agent:authored" --silent
          echo "Opened #${number} from ${BRANCH} as the App" | tee -a "$GITHUB_STEP_SUMMARY"
