# The rlp golden pipeline: one reusable workflow every rlp repo calls.
#
#   jobs:
#     golden:
#       uses: rdlucas2/rlp/.github/workflows/golden.yml@<rlp git ref>
#       with:
#         rlp-version: "0.2.0"
#       permissions:
#         contents: write          # publish: attach zips and jars to releases
#         packages: write          # publish: push images to GHCR
#         security-events: write   # gates: upload SARIF to code scanning
#
# Every step is a thin wrapper around an `rlp` command; the gate logic lives in
# the CLI (`rlp pipeline run`), so a laptop, `act` and Actions give the same
# results. See docs/pipeline.md.
name: golden

on:
  workflow_call:
    inputs:
      rlp-version:
        description: "rlp-cli to install: a PyPI version (0.2.0), git:<ref> or path:<dir in this repo>"
        type: string
        required: true
      deploy-env:
        description: Target environment for the deploy stage; empty skips deploy
        type: string
        default: ""
      deploy-local:
        description: Deploy to LocalStack instead of AWS (for act)
        type: boolean
        default: false
      components:
        description: Comma-separated component names; empty means every component
        type: string
        default: ""
      working-directory:
        description: Repo root of the project, relative to the checkout
        type: string
        default: "."
      python-version:
        description: Python used to run rlp
        type: string
        default: "3.13"
      publish:
        description: Publish artifacts on pushes to the default branch and on tags
        type: boolean
        default: true

# No workflow-level permissions: a called workflow may not ask for more than
# its caller grants, even for a job that ends up skipped. The gates job reads the
# repo and uploads SARIF; the publish job inherits what the caller grants.

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload the scanners' SARIF to code scanning
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      RLP_SPEC: ${{ inputs.rlp-version }}
      RLP_COMPONENTS: ${{ inputs.components }}
      RLP_DEPLOY_ENV: ${{ inputs.deploy-env }}
      RLP_DEPLOY_LOCAL: ${{ inputs.deploy-local }}
      # New code (sast findings, coverage) is measured from here: the PR's base
      # commit, or the commit before a push. Empty means the whole repo is new.
      RLP_BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
      SEMGREP_VERSION: "1.179.0"  # keep in step with SEMGREP_VERSION in cli/src/rlp_cli/tools.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the full history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install rlp
        run: |
          case "$RLP_SPEC" in
            git:*) spec="rlp-cli @ git+https://github.com/rdlucas2/rlp@${RLP_SPEC#git:}" ;;
            path:*) spec="${GITHUB_WORKSPACE}/${RLP_SPEC#path:}" ;;
            *) spec="rlp-cli==${RLP_SPEC}" ;;
          esac
          python -m pip install --disable-pip-version-check "$spec" pre-commit go-task-bin "semgrep==$SEMGREP_VERSION"
          rlp --version
      - name: precommit
        run: rlp pipeline run --reset --stage precommit --component "$RLP_COMPONENTS"
      - name: validate
        run: rlp pipeline run --stage validate --component "$RLP_COMPONENTS"
      - name: policy
        run: rlp pipeline run --stage policy --component "$RLP_COMPONENTS"
      - name: setup
        run: rlp pipeline run --stage setup --component "$RLP_COMPONENTS"
      - name: lint
        run: rlp pipeline run --stage lint --component "$RLP_COMPONENTS"
      - name: test
        run: rlp pipeline run --stage test --component "$RLP_COMPONENTS"
      - name: coverage
        run: rlp pipeline run --stage coverage --component "$RLP_COMPONENTS"
      - name: sast
        run: rlp pipeline run --stage sast --component "$RLP_COMPONENTS"
      - name: package
        run: rlp pipeline run --stage package --component "$RLP_COMPONENTS"
      - name: trivy
        run: rlp pipeline run --stage trivy --component "$RLP_COMPONENTS"
      - name: terraform
        run: rlp pipeline run --stage terraform --component "$RLP_COMPONENTS"
      - name: deploy
        run: |
          args=(--stage deploy --component "$RLP_COMPONENTS" --deploy-env "$RLP_DEPLOY_ENV")
          if [ "$RLP_DEPLOY_LOCAL" = "true" ]; then args+=(--deploy-local); fi
          rlp pipeline run "${args[@]}"
      - name: Gate summary
        if: always()
        run: |
          if command -v rlp >/dev/null; then
            rlp pipeline summary >> "$GITHUB_STEP_SUMMARY"
            rlp pipeline summary
          fi
      - name: Upload SARIF to code scanning
        # act has no code scanning API; the reports stay in .rlp/pipeline/reports/.
        if: always() && !env.ACT && hashFiles(format('{0}/.rlp/pipeline/reports/*.sarif', inputs.working-directory)) != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: ${{ inputs.working-directory }}/.rlp/pipeline/reports
      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rlp-gate-results
          path: |
            ${{ inputs.working-directory }}/.rlp/pipeline/results.json
            ${{ inputs.working-directory }}/.rlp/pipeline/reports/
          if-no-files-found: warn

  publish:
    needs: gates
    if: >-
      inputs.publish && github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    # Inherits the caller's grant: contents: write (releases), packages: write (GHCR).
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      RLP_SPEC: ${{ inputs.rlp-version }}
      RLP_COMPONENTS: ${{ inputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install rlp
        run: |
          case "$RLP_SPEC" in
            git:*) spec="rlp-cli @ git+https://github.com/rdlucas2/rlp@${RLP_SPEC#git:}" ;;
            path:*) spec="${GITHUB_WORKSPACE}/${RLP_SPEC#path:}" ;;
            *) spec="rlp-cli==${RLP_SPEC}" ;;
          esac
          python -m pip install --disable-pip-version-check "$spec" go-task-bin
      - name: Package
        run: rlp pipeline run --reset --stage setup --stage package --component "$RLP_COMPONENTS"
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          args=(--registry "$registry" --component "$RLP_COMPONENTS")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then args+=(--release "$GITHUB_REF_NAME"); fi
          rlp publish "${args[@]}"
