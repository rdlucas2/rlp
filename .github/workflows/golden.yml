# The rlp golden pipeline: one reusable workflow every rlp repo calls.
#
#   jobs:
#     golden:
#       uses: rdlucas2/rlp/.github/workflows/golden.yml@<rlp git ref>
#       with:
#         rlp-version: "0.2.0"
#       permissions:
#         contents: write          # publish: attach zips and jars to releases
#         packages: write          # publish: push images to GHCR
#         security-events: write   # gates: upload SARIF to code scanning
#         id-token: write          # deploy: GitHub OIDC for AWS (only with deploy-env)
#
# Every step is a thin wrapper around an `rlp` command; the gate logic lives in
# the CLI (`rlp pipeline run`), so a laptop, `act` and Actions give the same
# results. See docs/pipeline.md.
name: golden

on:
  workflow_call:
    inputs:
      rlp-version:
        description: "rlp-cli to install: a PyPI version (0.2.0), git:<ref> or path:<dir in this repo>"
        type: string
        required: true
      deploy-env:
        description: >-
          AWS environment to deploy to, for example dev. Plans on pull requests,
          applies on pushes to the default branch. Empty skips the deploy job.
        type: string
        default: ""
      deploy-local:
        description: Target LocalStack instead of AWS (for act); the AWS stages skip
        type: boolean
        default: false
      aws-region:
        description: AWS region of the environment
        type: string
        default: us-east-1
      aws-plan-role-arn:
        description: Read-only role pull requests assume through OIDC to plan (bootstrap output plan_role_arn)
        type: string
        default: ""
      aws-deploy-role-arn:
        description: Role the default branch assumes through OIDC to apply (bootstrap output deploy_role_arn)
        type: string
        default: ""
      tf-state-bucket:
        description: Terraform state bucket (bootstrap output state_bucket)
        type: string
        default: ""
      components:
        description: Comma-separated component names; empty means every component
        type: string
        default: ""
      working-directory:
        description: Repo root of the project, relative to the checkout
        type: string
        default: "."
      python-version:
        description: Python used to run rlp
        type: string
        default: "3.13"
      publish:
        description: Publish artifacts on pushes to the default branch and on tags
        type: boolean
        default: true
    secrets:
      infracost-api-key:
        description: >-
          Infracost API key for the cost stage. Without it the stage is skipped,
          unless rlp.yaml declares quality.cost.monthlyBudget.
        required: false

# No workflow-level permissions: a called workflow may not ask for more than
# its caller grants, even for a job that ends up skipped. The gates job reads the
# repo and uploads SARIF; the publish and deploy jobs inherit what the caller
# grants.

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload the scanners' SARIF to code scanning
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      RLP_SPEC: ${{ inputs.rlp-version }}
      RLP_COMPONENTS: ${{ inputs.components }}
      # New code (sast findings, coverage) is measured from here: the PR's base
      # commit, or the commit before a push. Empty means the whole repo is new.
      RLP_BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
      SEMGREP_VERSION: "1.179.0"  # keep in step with SEMGREP_VERSION in cli/src/rlp_cli/tools.py
      UV_VERSION: "0.11.32"  # templates run their verbs with uv (python-fastapi); keep in step with release.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the full history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install rlp
        run: |
          case "$RLP_SPEC" in
            git:*) spec="rlp-cli @ git+https://github.com/rdlucas2/rlp@${RLP_SPEC#git:}" ;;
            path:*) spec="${GITHUB_WORKSPACE}/${RLP_SPEC#path:}" ;;
            *) spec="rlp-cli==${RLP_SPEC}" ;;
          esac
          python -m pip install --disable-pip-version-check "$spec" pre-commit go-task-bin "uv==$UV_VERSION" "semgrep==$SEMGREP_VERSION"
          rlp --version
      - name: precommit
        run: rlp pipeline run --reset --stage precommit --component "$RLP_COMPONENTS"
      - name: validate
        run: rlp pipeline run --stage validate --component "$RLP_COMPONENTS"
      - name: policy
        run: rlp pipeline run --stage policy --component "$RLP_COMPONENTS"
      - name: setup
        run: rlp pipeline run --stage setup --component "$RLP_COMPONENTS"
      - name: lint
        run: rlp pipeline run --stage lint --component "$RLP_COMPONENTS"
      - name: test
        run: rlp pipeline run --stage test --component "$RLP_COMPONENTS"
      - name: coverage
        id: coverage
        run: rlp pipeline run --stage coverage --component "$RLP_COMPONENTS"
      # The anti-cheat rules RLP-A005 and RLP-A006 (no drop in test count or
      # line coverage, #72) compare this run's results with the base commit's.
      # Pushes to the default branch keep their results.json in the Actions
      # cache, which pull requests can read without an actions: read grant.
      - name: Gate results cache key
        id: results-key
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure')
        env:
          SCOPE: ${{ inputs.working-directory }}|${{ inputs.components }}
        run: echo "scope=$(printf '%s' "$SCOPE" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Base commit's gate results
        if: steps.results-key.outcome == 'success'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/rlp-base-results
          key: rlp-gate-results-${{ steps.results-key.outputs.scope }}-${{ github.event.pull_request.base.sha }}
      - name: policy (test count and coverage)
        if: steps.results-key.outcome == 'success'
        run: |
          base="$RUNNER_TEMP/rlp-base-results/results.json"
          if [ -f "$base" ]; then
            export RLP_BASE_RESULTS="$base"
          else
            echo "::notice::no gate results cached for base commit ${BASE_SHA:0:12}, so RLP-A005 and RLP-A006 are skipped"
          fi
          rlp pipeline run --stage policy --component "$RLP_COMPONENTS"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: sast
        run: rlp pipeline run --stage sast --component "$RLP_COMPONENTS"
      - name: package
        run: rlp pipeline run --stage package --component "$RLP_COMPONENTS"
      - name: trivy
        run: rlp pipeline run --stage trivy --component "$RLP_COMPONENTS"
      - name: Keep the gate results for pull requests
        id: keep-results
        if: >-
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          SCOPE: ${{ inputs.working-directory }}|${{ inputs.components }}
        run: |
          mkdir -p "$RUNNER_TEMP/rlp-base-results"
          cp .rlp/pipeline/results.json "$RUNNER_TEMP/rlp-base-results/results.json"
          echo "scope=$(printf '%s' "$SCOPE" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache the gate results
        if: steps.keep-results.outcome == 'success'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/rlp-base-results
          key: rlp-gate-results-${{ steps.keep-results.outputs.scope }}-${{ github.sha }}
      - name: Gate summary
        if: always()
        run: |
          if command -v rlp >/dev/null; then
            rlp pipeline summary >> "$GITHUB_STEP_SUMMARY"
            rlp pipeline summary
          fi
      - name: Upload SARIF to code scanning
        # act has no code scanning API; the reports stay in .rlp/pipeline/reports/.
        if: always() && !env.ACT && hashFiles(format('{0}/.rlp/pipeline/reports/*.sarif', inputs.working-directory)) != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: ${{ inputs.working-directory }}/.rlp/pipeline/reports
      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rlp-gate-results
          path: |
            ${{ inputs.working-directory }}/.rlp/pipeline/results.json
            ${{ inputs.working-directory }}/.rlp/pipeline/reports/
          if-no-files-found: warn

  publish:
    needs: gates
    if: >-
      inputs.publish && github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    # Inherits the caller's grant: contents: write (releases), packages: write (GHCR).
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      RLP_SPEC: ${{ inputs.rlp-version }}
      RLP_COMPONENTS: ${{ inputs.components }}
      UV_VERSION: "0.11.32"  # keep in step with the gates job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install rlp
        run: |
          case "$RLP_SPEC" in
            git:*) spec="rlp-cli @ git+https://github.com/rdlucas2/rlp@${RLP_SPEC#git:}" ;;
            path:*) spec="${GITHUB_WORKSPACE}/${RLP_SPEC#path:}" ;;
            *) spec="rlp-cli==${RLP_SPEC}" ;;
          esac
          python -m pip install --disable-pip-version-check "$spec" go-task-bin "uv==$UV_VERSION"
      - name: Package
        run: rlp pipeline run --reset --stage setup --stage package --component "$RLP_COMPONENTS"
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          args=(--registry "$registry" --component "$RLP_COMPONENTS")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then args+=(--release "$GITHUB_REF_NAME"); fi
          rlp publish "${args[@]}"

  # Plan and estimate the cost on every run with deploy-env; apply only on
  # pushes to the default branch. AWS credentials come from GitHub OIDC: the job exchanges its ID
  # token for a short-lived session of the plan or deploy role, so no AWS keys
  # live in GitHub secrets. See docs/aws.md.
  deploy:
    needs: [gates, publish]
    if: >-
      !cancelled() && inputs.deploy-env != '' && needs.gates.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    # Inherits the caller's grant, which must include id-token: write.
    concurrency:
      group: rlp-deploy-${{ github.repository }}-${{ inputs.deploy-env }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      RLP_SPEC: ${{ inputs.rlp-version }}
      RLP_COMPONENTS: ${{ inputs.components }}
      RLP_DEPLOY_ENV: ${{ inputs.deploy-env }}
      RLP_DEPLOY_LOCAL: ${{ inputs.deploy-local }}
      RLP_TF_STATE_BUCKET: ${{ inputs.tf-state-bucket }}
      AWS_REGION: ${{ inputs.aws-region }}
      INFRACOST_API_KEY: ${{ secrets.infracost-api-key }}
      APPLY: >-
        ${{ github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      PLAN_ROLE: ${{ inputs.aws-plan-role-arn }}
      DEPLOY_ROLE: ${{ inputs.aws-deploy-role-arn }}
      TERRAFORM_VERSION: "1.12.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install rlp
        run: |
          case "$RLP_SPEC" in
            git:*) spec="rlp-cli @ git+https://github.com/rdlucas2/rlp@${RLP_SPEC#git:}" ;;
            path:*) spec="${GITHUB_WORKSPACE}/${RLP_SPEC#path:}" ;;
            *) spec="rlp-cli==${RLP_SPEC}" ;;
          esac
          python -m pip install --disable-pip-version-check "$spec"
          rlp --version
          # The Terraform modules come from the same rlp as the CLI.
          case "$RLP_SPEC" in
            git:*) modules="git::https://github.com/rdlucas2/rlp.git//infra/modules?ref=${RLP_SPEC#git:}" ;;
            path:*) modules="${GITHUB_WORKSPACE}/${RLP_SPEC#path:}/infra/modules" ;;
            *) modules="" ;;  # rlp uses the modules at its own version tag
          esac
          echo "RLP_MODULES_SOURCE=$modules" >> "$GITHUB_ENV"
          echo "RLP_REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Install Terraform
        if: inputs.deploy-local == false
        working-directory: ${{ runner.temp }}
        run: |
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -sSfLO "$base/$zip"
          curl -sSfLO "$base/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          grep " ${zip}\$" "terraform_${TERRAFORM_VERSION}_SHA256SUMS" | sha256sum --check --strict
          unzip -q -o "$zip" terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/terraform" version
      - name: AWS credentials (GitHub OIDC)
        if: inputs.deploy-local == false
        run: |
          if [ "$APPLY" = "true" ]; then role="$DEPLOY_ROLE"; else role="$PLAN_ROLE"; fi
          if [ -z "$role" ] || [ -z "$RLP_TF_STATE_BUCKET" ]; then
            echo "::error::deploy-env is set, so aws-plan-role-arn, aws-deploy-role-arn and tf-state-bucket are needed (see docs/aws.md)"
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::no GitHub OIDC token: the calling workflow must grant id-token: write"
            exit 1
          fi
          # Terraform's AWS provider and S3 backend read these and call
          # AssumeRoleWithWebIdentity themselves; the token is refreshed before each step.
          cat > "$RUNNER_TEMP/aws-oidc.sh" <<'SCRIPT'
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
            python -c 'import json, sys; print(json.load(sys.stdin)["value"])' > "$RUNNER_TEMP/aws-web-identity-token"
          SCRIPT
          {
            echo "AWS_ROLE_ARN=$role"
            echo "AWS_WEB_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/aws-web-identity-token"
            echo "AWS_ROLE_SESSION_NAME=rlp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"
      - name: terraform
        run: |
          if [ -f "$RUNNER_TEMP/aws-oidc.sh" ]; then bash "$RUNNER_TEMP/aws-oidc.sh"; fi
          args=(--reset --stage terraform --component "$RLP_COMPONENTS" --deploy-env "$RLP_DEPLOY_ENV")
          if [ "$RLP_DEPLOY_LOCAL" = "true" ]; then args+=(--deploy-local); fi
          rlp pipeline run "${args[@]}"
      - name: cost
        run: |
          args=(--stage cost --component "$RLP_COMPONENTS" --deploy-env "$RLP_DEPLOY_ENV")
          if [ "$RLP_DEPLOY_LOCAL" = "true" ]; then args+=(--deploy-local); fi
          rlp pipeline run "${args[@]}"
      - name: deploy
        if: env.APPLY == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/aws-oidc.sh" ]; then bash "$RUNNER_TEMP/aws-oidc.sh"; fi
          args=(--stage deploy --component "$RLP_COMPONENTS" --deploy-env "$RLP_DEPLOY_ENV")
          if [ "$RLP_DEPLOY_LOCAL" = "true" ]; then args+=(--deploy-local); fi
          rlp pipeline run "${args[@]}"
      - name: Deploy summary
        if: always()
        run: |
          if command -v rlp >/dev/null; then
            rlp pipeline summary >> "$GITHUB_STEP_SUMMARY"
            rlp pipeline summary
          fi
      - name: Upload deploy results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rlp-deploy-results
          path: |
            ${{ inputs.working-directory }}/.rlp/pipeline/results.json
            ${{ inputs.working-directory }}/.rlp/infra/*/policy/plan.json
            ${{ inputs.working-directory }}/.rlp/pipeline/reports/infracost.json
          if-no-files-found: warn
