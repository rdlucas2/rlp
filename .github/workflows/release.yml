# Release rlp-cli when a version tag (v1.2.3) is pushed: build the wheel and
# sdist with uv, build and test a standalone binary on each OS, attach them
# with SHA256 checksums to a GitHub Release, then publish to PyPI through
# trusted publishing. Nothing here runs on pull requests.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' cli/src/rlp_cli/__init__.py)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match rlp_cli.__version__ ${version}" >&2
            exit 1
          fi

  python-dist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install "uv==0.11.32"
          uv build --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  binaries:
    needs: version
    name: binary / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # Apple silicon only for now; Intel Macs install the wheel (see cli/README.md).
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install rlp-cli, test tools and PyInstaller
        run: python -m pip install . "pytest==9.1.1" go-task-bin "pyinstaller==6.22.3"
      - name: Build the binary
        id: binary
        run: echo "path=$(python cli/build_binary.py --dist dist | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Test the binary
        env:
          RLP_BIN: ${{ steps.binary.outputs.path }}
        run: python -m pytest cli/tests -p no:cacheprovider
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: binary-${{ matrix.os }}
          path: ${{ steps.binary.outputs.path }}
          if-no-files-found: error

  github-release:
    needs: [python-dist, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "rlp ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

  pypi:
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rlp-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
