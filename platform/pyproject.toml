[project]
name = "rlp-platform"
version = "0.1.0"
description = "rlp-platform: a FastAPI service rendered from the rlp python-fastapi template."
readme = "README.md"
# Fixed so uv.lock stays valid for every supported Python; the image and
# local tooling use .python-version.
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlp_platform"]

[tool.uv]
# The project itself is installed non-editable in the image; locally it is editable.
package = true

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
