# Platform settings the policy bundle reads as data.platform. Changing a value
# here changes the gate for every repo, so it goes through review like code.

# Lowest quality.coverage.minimum a repo may declare (percent).
coverage_floor: 70

# Tags every taggable AWS resource in a Terraform plan must carry.
required_tags:
  - rlp:project
  - rlp:environment
  - rlp:managed-by

# Default spend cap for one remediation loop run (USD), when `rlp loop <kind>`
# is not given --max-spend. See docs/loops.md.
loop_max_spend_usd: 5

# Days a retired project's artifacts (images, release assets) are kept before
# `python -m rlp_platform expire-artifacts` deletes them. `rlp lifecycle retire`
# sends it when a retirement starts. See docs/lifecycle.md.
artifact_retention_days: 30

# Days a deprecated project's services may serve no traffic before the nightly
# retirement sweep flags it for retirement. `rlp lifecycle sweep` sends it; the
# sweep only flags, a person runs `rlp lifecycle retire`. See docs/lifecycle.md.
retirement_idle_days: 30

# GitHub logins whose pull requests count as agent-authored for the rlp.agent
# anti-cheat rules, besides any PR labelled agent:authored. localrlp is the
# GitHub App loop workflows open PRs as (#51, docs/loops.md#agent-identity).
agent_authors:
  - localrlp[bot]
