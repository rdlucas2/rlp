# Standard rlp verbs. Every rlp repo implements these targets; the rlp CLI and
# the golden pipeline call them by name. Verbs with nothing to do yet are
# explicit no-ops so the contract holds from day one.
version: "3"

vars:
  PYTHON: '{{if eq OS "windows"}}python{{else}}python3{{end}}'
  VENV_PYTHON: '{{if eq OS "windows"}}.venv/Scripts/python.exe{{else}}.venv/bin/python{{end}}'
  OPA: '.tools/bin/opa{{exeExt}}'

tasks:
  setup:
    desc: Install dependencies and git hooks
    cmds:
      - pre-commit install

  lint:
    desc: Run every pre-commit hook against the whole repo
    cmds:
      - pre-commit run --all-files

  test:
    desc: Run tests and write reports to declared paths
    deps: [test-deps, policy-tools]
    cmds:
      - '{{.OPA}} check --strict policy'
      - '{{.OPA}} test policy/'
      - '{{.VENV_PYTHON}} -m pytest --junitxml=reports/junit.xml'

  test-deps:
    internal: true
    desc: Create .venv with rlp-cli (editable) and the test dependencies
    sources:
      - pyproject.toml
    generates:
      - '{{.VENV_PYTHON}}'
    cmds:
      - '{{.PYTHON}} -m venv .venv'
      - '{{.VENV_PYTHON}} -m pip install --quiet --disable-pip-version-check -e ".[test]"'

  policy-tools:
    internal: true
    desc: Install the pinned OPA and conftest into .tools/bin
    cmds:
      - '{{.PYTHON}} scripts/install_policy_tools.py'

  build:
    desc: Compile, if applicable
    cmds:
      - 'echo "Nothing to build yet"'

  package:
    desc: Build the rlp-cli wheel and sdist into dist/
    cmds:
      - uv build --out-dir dist

  binary:
    desc: Build the standalone rlp binary for this OS into dist/
    deps: [test-deps]
    cmds:
      - '{{.VENV_PYTHON}} -m pip install --quiet --disable-pip-version-check pyinstaller==6.22.3'
      - '{{.VENV_PYTHON}} cli/build_binary.py'

  run:
    desc: Start locally against local backing services
    cmds:
      - 'echo "Nothing to run yet; the platform stub arrives in #18"'

  smoke:
    desc: Check health endpoints of a running instance
    cmds:
      - 'echo "Nothing to smoke-test yet"'
