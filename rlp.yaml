# yaml-language-server: $schema=https://raw.githubusercontent.com/rdlucas2/rlp/main/schemas/v1alpha1/repo.schema.json
# rlp is project #1: the repo runs under its own contract and golden pipeline (#18).
#
# The platform component was rendered from the python-fastapi template into
# platform/ (see platform/.copier-answers.yml). platform/rlp.yaml is the
# template's own copy of this component, kept so `rlp update platform` works;
# this file is the contract the pipeline and `rlp run` read for the repo.
#
# No backing services yet. The Postgres state store arrives with the slice 2
# API (#3); in AWS, rlp doesn't create databases in S0, so a declared postgres
# service would leave DATABASE_URL as an empty secret and the task couldn't
# start. Without DATABASE_URL, /readyz doesn't check a database.
#
# The CLI (cli/) is not a component yet: its outputs are a wheel and per-OS
# binaries, and v1alpha1 has no artifact kind or runtime for either. Until it
# does, the CLI keeps its own workflows (ci.yml, cli.yml, release.yml).
apiVersion: rlp/v1alpha1
kind: Repo
metadata:
  name: rlp
  project: rlp
  description: rlp, the agent-native internal developer platform, gated by its own pipeline.
  owners:
    - rdlucas2
components:
  - name: platform
    path: platform
    language: python
    artifact:
      kind: container-image
      dockerfile: Dockerfile
    runtime:
      kind: container-service
      port: 8000
      health:
        liveness: /healthz
        readiness: /readyz
    # Every verb runs `task <name>` in platform/ unless overridden here.
    verbs: {}
    reports:
      junit: reports/junit.xml
      coverage:
        format: cobertura
        path: reports/coverage.xml
    config:
      - name: PORT
        description: Port the service listens on.
        default: "8000"
      - name: LOG_LEVEL
        description: Log level for the JSON logger (debug, info, warning, error, critical).
        default: info
      - name: RLP_MIGRATE_ON_START
        description: Apply pending database migrations at startup (true or false); `python -m rlp_platform migrate` runs them on demand.
        default: "false"
      - name: RLP_API_TOKEN
        description: Bearer token every /api/v1 request must carry; without it the service won't start unless RLP_API_TOKEN_DISABLED=true.
        secret: true
      - name: RLP_API_TOKEN_DISABLED
        description: Serve /api/v1 without a token (true or false). For local development only.
        default: "false"
      - name: RLP_GITHUB_WEBHOOK_SECRET
        description: Secret GitHub signs webhook deliveries with; POST /api/v1/hooks/github refuses every delivery (401) without it.
        secret: true
      - name: RLP_GITHUB_TOKEN
        description: GitHub token the repo indexer reads rlp.yaml and .copier-answers.yml with (needs contents read).
        secret: true
      - name: RLP_GITHUB_REPOS
        description: Repos (OWNER/NAME, comma-separated) the periodic sync re-indexes; unset, every repo of the token's installation.
      - name: RLP_GITHUB_API_URL
        description: GitHub REST API base URL; change it for GitHub Enterprise Server.
        default: https://api.github.com
    telemetry:
      enabled: true
      serviceName: rlp-platform
quality:
  coverage:
    minimum: 80
