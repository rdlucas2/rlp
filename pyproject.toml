[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rlp-cli"
dynamic = ["version"]
description = "The rlp command-line tool: validate contracts, check policy, run the standard verbs and scaffold from templates."
readme = "cli/README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "rdlucas2" }]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.1,<9",
    "copier>=9.4,<10",
    "diff-cover>=10.6,<11",
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
    "coverage==7.16.2",
    "pytest==9.1.1",
]

[project.scripts]
rlp = "rlp_cli.cli:main"

[project.urls]
Homepage = "https://github.com/rdlucas2/rlp"
Issues = "https://github.com/rdlucas2/rlp/issues"

[tool.hatch.version]
path = "cli/src/rlp_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cli/src/rlp_cli"]

# The contract schemas and the policy bundle ship inside the package, so an
# installed rlp works without a checkout of this repo.
[tool.hatch.build.targets.wheel.force-include]
"schemas/v1alpha1" = "rlp_cli/_data/schemas/v1alpha1"
"policy" = "rlp_cli/_data/policy"

[tool.hatch.build.targets.sdist]
only-include = ["cli/src", "cli/README.md", "schemas/v1alpha1", "policy", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["schemas/tests", "tests/policy", "tests/pipeline", "cli/tests"]
# Fixture repos carry their own tests; they run inside the fixture, not here.
norecursedirs = ["fixtures", ".*", "build", "dist", "*.egg", ".venv", "venv", "node_modules"]
